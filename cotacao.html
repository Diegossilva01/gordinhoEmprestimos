<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotação · Gordinho Empréstimos</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="skin.css?v=2"><style>.quote-header{padding:16px 5%;display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid var(--line);gap:20px}.quote-header img{width:220px;height:90px;object-fit:contain}.quote-header a{font-size:14px;color:var(--muted)}.quote-main{display:block;max-width:1100px;margin:auto;padding:35px 20px}.quote-main>h1{font-size:30px;margin-bottom:8px}.quote-intro{color:var(--muted);font-size:16px;margin-bottom:25px}.quote-layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:20px}.quote-layout button{width:100%}.quote-value{font-size:32px;display:block;margin:8px 0}.quote-amounts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:20px 0}.quote-amounts>div{background:var(--soft);padding:15px;border-radius:8px}.quote-amounts small,.quote-amounts strong{display:block}.quote-amounts strong{font-size:21px}.quote-foot{font-size:13px;color:var(--muted);line-height:1.6}.quote-layout .error{margin-bottom:15px}@media(max-width:720px){.quote-layout{grid-template-columns:1fr}.quote-header img{width:180px;height:75px}.quote-main{padding:25px 15px}.quote-main>h1{font-size:26px}.quote-amounts strong{font-size:19px}}</style></head><body><header class="quote-header"><img src="logo-gordinho.png" alt="Gordinho Empréstimos"><a href="index.html">Acesso administrativo</a></header><main class="quote-main"><h1>Simule seu empréstimo</h1><p class="quote-intro">Escolha o valor e a quantidade de parcelas para estimar o pagamento.</p><div class="quote-layout"><section class="panel"><form id="quote-form"><label>Quanto você precisa? (R$)<input name="amount" type="number" value="1000" min="0.01" max="10000000" step="0.01" required></label><label>Quantidade de parcelas<input name="count" type="number" value="6" min="1" max="120" step="1" required></label><label>Frequência de pagamento<select name="period"><option value="mensal">Mensal</option><option value="quinzenal">Quinzenal</option><option value="semanal">Semanal</option><option value="diaria">Diária</option></select></label><label>Primeiro vencimento<input name="firstDue" type="date" required></label><label>Taxa ilustrativa do contrato (%)<input name="rate" type="number" value="10" min="0" max="1000" step="0.01" required></label><button class="primary" type="submit">Calcular simulação</button></form><p class="quote-foot" style="margin-top:18px">A taxa desta calculadora é ilustrativa e pode ser alterada para testar cenários. A taxa efetiva precisa ser confirmada com a loja.</p></section><section class="panel"><h2>Sua simulação</h2><div id="quote-result" aria-live="polite"></div></section></div></main><script src="core.js"></script><script src="quote.js"></script></body></html>
