<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gordinho Empréstimos</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head>
<body>
<section id="login"><div class="login-brand"><img class="brand-logo" src="logo-gordinho.png" alt="Gordinho Empréstimos"><h1>Seu controle.<br>Do início ao recebimento.</h1><p>Empréstimos, vencimentos e resultados em um só lugar.</p></div><form id="login-form" class="login-card"><span class="eyebrow">GORDINHO EMPRÉSTIMOS</span><h2>Acessar o sistema</h2><label>Usuário<input name="username" autocomplete="username" required maxlength="100"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><p id="login-error" role="alert"></p><button class="primary" type="submit">Entrar</button><p class="muted">Acesso administrativo</p></form></section>
<div id="app" hidden><aside class="sidebar"><div class="brand"><img class="brand-logo" src="logo-gordinho.png" alt="Gordinho Empréstimos"></div><nav><button data-view="dashboard" class="active">Visão geral</button><button data-view="loans">Empréstimos</button><button data-view="clients">Clientes</button><button data-view="payments">Pagamentos</button><button data-view="results">Resultados</button></nav><div class="sidebar-foot"><button id="password-btn">Alterar senha</button><button id="logout">Sair da conta</button></div></aside><main><header><div><p class="eyebrow">GORDINHO EMPRÉSTIMOS</p><h1 id="view-title">Visão geral</h1></div><div class="header-actions"><button id="refresh">Atualizar</button><button id="new-loan" class="primary">+ Novo empréstimo</button></div></header><p id="error" class="error" role="alert" hidden></p><div id="content" aria-live="polite"></div></main></div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Fechar">✕</button></div><div id="modal-body"></div><p id="modal-error" class="error" role="alert" hidden></p></dialog><div id="toast" role="status" hidden></div>
<script src="config.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
